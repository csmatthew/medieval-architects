{% extends "base.html" %}
{% block title %}{{ building.name }} | Building{% endblock title %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="card-title mb-3">{{ building.name }}</h2>
                    <p class="text-muted mb-4">Slug: {{ building.slug }}</p>
                    <a href="{% url 'record_list' %}" class="btn btn-secondary">Back to Records</a>
                    <a href="{% url 'mapper' %}" class="btn btn-primary ms-2">Return to Map</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
