{% extends "base.html" %}
{% block title %}{{ record.name }} | Record{% endblock title %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="card-title mb-3">{{ record.name }}</h2>
                    <a href="{% url 'record_list' %}" class="btn btn-secondary"
                        >Back to List</a
                    >
                    {% if record.latitude and record.longitude %}
                    <a
                        href="{% url 'home' %}?lat={{ record.latitude }}&lng={{ record.longitude }}&zoom=15"
                        class="btn btn-primary ms-2"
                        >View on Map</a
                    >
                    {% else %}
                    <a href="{% url 'mapper' %}" class="btn btn-primary ms-2"
                        >Return to Map</a
                    >
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
